# Render Infrastructure Blueprint Configuration
# Deploy Database, Django Backend, and Vue Frontend together on Render

services:
  # 1. Django Backend Web Service
  - type: web
    name: negen-sdd-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_COOKIE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: negen-sdd-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: negen-sdd-frontend
          property: url
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: negen-sdd-frontend
          property: url
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: negen-sdd-frontend
          property: url

  # 2. Vue Frontend Static Site
  - type: web
    name: negen-sdd-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: negen-sdd-backend
          property: url
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  # 3. PostgreSQL Database
  - name: negen-sdd-db
    databaseName: negen_sdd_db
    user: negen_user
    plan: free
